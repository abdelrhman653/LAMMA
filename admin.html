<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — دعوتي</title><link rel="stylesheet" href="styles.css"></head><body><main class="center-shell"><div class="wide-card"><header class="account-bar"><div><b>لوحة الأدمن</b><small>مراجعة المدفوعات</small></div><button id="adminLogout" class="text-btn">خروج</button></header><div id="adminLogin"><h1>دخول الأدمن</h1><form id="adminLoginForm" class="auth-form"><input id="adminEmail" type="email" required placeholder="إيميل الأدمن"><input id="adminPass" type="password" required placeholder="كلمة المرور"><button class="btn primary" type="submit">دخول</button></form></div><div id="adminPanel" class="hidden"><div class="dashboard-head"><div><span class="eyebrow">Pending</span><h1>طلبات الدفع</h1></div></div><div id="paymentsList"></div></div></div></main><div id="toast" class="toast"></div><script src="firebase-config.js"></script><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";import{getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,query,where,onSnapshot,updateDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
const c=window.FIREBASE_CONFIG||{},configured=!!(c.apiKey&&c.authDomain&&c.projectId);const app=initializeApp(c),auth=getAuth(app),db=getFirestore(app),$=s=>document.querySelector(s);function toast(m){const x=$("#toast");x.textContent=m;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
async function isAdmin(u){if(!u)return false;const s=await getDoc(doc(db,'admins',u.uid));return s.exists()&&s.data().active!==false}
$('#adminLoginForm').onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$('#adminEmail').value.trim(),$('#adminPass').value); }catch{toast('بيانات الأدمن غير صحيحة')}};$('#adminLogout').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$('#adminLogin').classList.remove('hidden');$('#adminPanel').classList.add('hidden');return}if(!(await isAdmin(u))){toast('الحساب ده مش أدمن');await signOut(auth);return}$('#adminLogin').classList.add('hidden');$('#adminPanel').classList.remove('hidden');load()});
function load(){const q=query(collection(db,'payments'),where('status','==','pending'));onSnapshot(q,s=>{$('#paymentsList').innerHTML=s.empty?'<div class="empty">مفيش طلبات دفع معلقة.</div>':s.docs.map(d=>{const x=d.data();return `<div class="payment-row"><div><b>${esc(x.name||'بدون اسم')}</b><small>${esc(x.email||'')} · ${esc(x.amount||'')} · عملية: ${esc(x.reference||'')}</small></div><div class="payment-actions"><a class="btn secondary" href="${x.proofUrl}" target="_blank" rel="noopener">عرض الإثبات</a><button class="btn primary" data-ok="${d.id}" data-uid="${x.uid}">تأكيد الدفع</button><button class="btn secondary" data-no="${d.id}" data-uid="${x.uid}">رفض</button></div></div>`}).join('');document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>decide(b.dataset.ok,b.dataset.uid,'approved'));document.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>decide(b.dataset.no,b.dataset.uid,'rejected'))})}
async function decide(pid,uid,status){try{await updateDoc(doc(db,'payments',pid),{status,reviewedAt:serverTimestamp()});await updateDoc(doc(db,'users',uid),{paymentStatus:status});toast(status==='approved'?'تم تأكيد الدفع':'تم رفض العملية')}catch{toast('تعذر تحديث العملية')}}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
